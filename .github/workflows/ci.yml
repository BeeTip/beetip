name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    env:
      BEETIP_MODE: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/check-staging.test.mjs
      - run: node scripts/notification-registry.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: beetip-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BEETIP_LOCAL_DATABASE_URL: postgres://postgres:beetip-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-atomic-acceptance.mjs
      - run: node scripts/test-btp07-expiry.mjs
      - run: node scripts/test-btp08-chat.mjs
      - run: node scripts/test-btp09-support.mjs
      - run: node scripts/test-btp12-funding.mjs
      - run: node scripts/test-btp13-amendments.mjs
      - run: node scripts/test-transactional-email-db.mjs
