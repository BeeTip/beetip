name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    env:
      BEETIP_MODE: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/check-staging.test.mjs scripts/check-connected-build.test.mjs
      - run: node scripts/notification-registry.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build connected production candidate
        run: pnpm build
        env:
          BEETIP_MODE: connected
          VERCEL_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
          APP_ORIGIN: ''
      - name: Verify connected release artifacts
        run: node scripts/check-connected-build.mjs
      - name: Verify connected production startup without identity configuration
        run: pnpm exec playwright test --config playwright.release.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: beetip-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BEETIP_LOCAL_DATABASE_URL: postgres://postgres:beetip-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-atomic-acceptance.mjs
      - run: node scripts/test-btp07-expiry.mjs
      - run: node scripts/test-btp08-chat.mjs
      - run: node scripts/test-btp09-support.mjs
      - run: node scripts/test-btp12-funding.mjs
      - run: node scripts/test-btp13-amendments.mjs
      - run: node scripts/test-btp15-handover.mjs
      - run: node scripts/test-btp16-cases.mjs
      - run: node scripts/test-btp17-transfers.mjs
      - run: node scripts/test-btp18-reconciliation.mjs
      - run: node scripts/test-btp19-moderation.mjs
      - run: node scripts/test-booth-rating-cases.mjs
      - run: node scripts/test-transactional-email-db.mjs
  fresh-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEETIP_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: 2.114.0
      - name: Start a disposable Supabase stack
        run: |
          stack="$RUNNER_TEMP/beetip-connected-ci"
          mkdir -p "$stack/supabase"
          cp -R supabase/{config.toml,migrations,templates,functions} "$stack/supabase/"
          sed -i 's/^project_id = "beetip"$/project_id = "beetip_connected_ci"/' "$stack/supabase/config.toml"
          sed -i '/^\[db.seed\]/,/^\[/{s/^enabled = true$/enabled = false/;}' "$stack/supabase/config.toml"
          supabase start --workdir "$stack" -x studio,imgproxy,logflare,vector,edge-runtime,postgres-meta > /dev/null
          printf 'BEETIP_TEST_LOCAL_STACK=%s\n' "$stack" >> "$GITHUB_ENV"
      - name: Verify migrated authorization and notification rules
        run: node scripts/test-fresh-supabase.mjs
      - name: Check generated public schema types
        run: |
          supabase gen types --local --schema public --workdir "$BEETIP_TEST_LOCAL_STACK" > "$RUNNER_TEMP/beetip-database.types.ts"
          node scripts/check-database-types.mjs "$RUNNER_TEMP/beetip-database.types.ts"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Rehearse the connected demo with independent accounts
        env:
          BEETIP_MODE: connected
          VERCEL_ENV: production
          APP_ORIGIN: http://127.0.0.1:3196
          BEETIP_TEST_URL: http://127.0.0.1:3196
        run: |
          config="$(supabase status --workdir "$BEETIP_TEST_LOCAL_STACK" -o json)"
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -er .API_URL <<< "$config")"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(jq -er .PUBLISHABLE_KEY <<< "$config")"
          export BEETIP_RECEIPT_STORAGE_SECRET="$(jq -er .SECRET_KEY <<< "$config")"
          export BEETIP_CASE_STORAGE_SECRET="$BEETIP_RECEIPT_STORAGE_SECRET"
          pnpm build
          node scripts/check-connected-build.mjs
          pnpm --filter @beetip/web exec next start --hostname 127.0.0.1 --port 3196 > "$RUNNER_TEMP/beetip-connected-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail --silent --show-error "$APP_ORIGIN" > /dev/null
          node scripts/test-connected-demo.mjs
          node scripts/test-btp16-case-sessions.mjs
